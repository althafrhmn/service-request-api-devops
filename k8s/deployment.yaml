apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-request-api
  labels:
    app: service-request-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-request-api
  template:
    metadata:
      labels:
        app: service-request-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/althafrhmn/service-request-api-devops:7e154e58284b9f10859e8be0f354af6114aa3b9e
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi